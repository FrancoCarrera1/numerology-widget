<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#12110d" />
    <title>Daily Energy — Numerology Widget</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="page">
      <header class="masthead">
        <p class="eyebrow">GG33</p>
        <h1>Daily Energy</h1>
        <p class="subhead">
          Daily energy, the monthly calendar, and universal/personal timing cycles for Mac, Android, and the web.
        </p>
      </header>

      <section class="stage">
        <numerology-widget id="widget" auto-refresh></numerology-widget>

        <div class="controls">
          <label class="date-control">
            <span>Jump to a date</span>
            <input id="date-picker" type="date" />
          </label>
          <button id="today-button" type="button">Return to today</button>
        </div>
      </section>

      <footer class="colophon">
        <span>Primary energy = full date calculation</span>
        <span class="dot" aria-hidden="true"></span>
        <span>Secondary energy = day of the month</span>
        <span class="dot" aria-hidden="true"></span>
        <span>Universal + Personal Year/Month</span>
      </footer>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
